[project]
name = "jobinbox"
version = "0.1.0"
description = "Email-driven job application tracking (PoC)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.0",
]

[project.scripts]
jobinbox = "jobinbox.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
