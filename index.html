<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>INbox PoC - Gmail + LLM</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 64rem;
        margin: 1rem auto 3rem;
        padding: 0 1rem;
        line-height: 1.45;
      }
      h1 {
        margin-bottom: 0.4rem;
      }
      .subtle {
        color: #555;
      }
      #controls {
        display: grid;
        grid-template-columns: 8rem 1fr auto;
        gap: 0.5rem;
        align-items: center;
        margin: 1rem 0;
      }
      #controls input {
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 0.45rem 0.6rem;
      }
      button {
        border: 1px solid #999;
        background: #f3f3f3;
        border-radius: 6px;
        padding: 0.45rem 0.75rem;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #status {
        min-height: 1.25rem;
        color: #444;
        margin-bottom: 0.75rem;
      }
      #status.error {
        color: #b00020;
      }
      #viewer {
        display: none;
        border: 1px solid #d0d0d0;
        border-radius: 8px;
        padding: 1rem;
        background: #fafafa;
      }
      #meta {
        margin-bottom: 0.8rem;
      }
      #meta strong {
        font-size: 1.1rem;
        display: block;
        margin-bottom: 0.2rem;
      }
      #email_body {
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 42vh;
        overflow: auto;
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        padding: 0.75rem;
      }
      #nav {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-top: 0.75rem;
      }
      #position {
        color: #555;
      }
      .card {
        margin-top: 1rem;
        border: 1px solid #d0d0d0;
        border-radius: 8px;
        background: #fff;
        padding: 0.75rem;
      }
      .card h2 {
        margin: 0 0 0.45rem 0;
        font-size: 1rem;
      }
      #llm_state {
        color: #555;
        margin-bottom: 0.4rem;
      }
      #llm_json {
        margin: 0;
        background: #f5f5f5;
        border: 1px solid #e5e5e5;
        border-radius: 6px;
        padding: 0.65rem;
        max-height: 22vh;
        overflow: auto;
      }
      @media (max-width: 700px) {
        #controls {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>INbox PoC</h1>
    <p class="subtle">
      Browse the most recent emails (up to 200) and view LLM extraction output:
      <code>{ application, company, role, stage }</code>.
    </p>

    <div id="controls">
      <input id="limit_input" type="number" min="1" max="200" value="200" />
      <input id="query_input" type="text" value="in:inbox" />
      <button id="load_btn" type="button">Load emails</button>
    </div>

    <div id="status"></div>

    <div id="viewer">
      <div id="meta"></div>
      <div id="email_body"></div>

      <div id="nav">
        <button id="back_btn" type="button">Back</button>
        <button id="next_btn" type="button">Next</button>
        <span id="position"></span>
      </div>

      <div class="card">
        <h2>LLM output</h2>
        <div id="llm_state"></div>
        <pre id="llm_json"></pre>
        <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem">
          <button id="classify_btn" type="button">Classify with LLM</button>
          <button id="reanalyze_btn" type="button">Re-run LLM (ignore cache)</button>
        </div>
      </div>
    </div>

    <script>
      const state = {
        messages: [],
        currentIndex: 0,
        analysisById: new Map(),
      };

      const $ = (id) => document.getElementById(id);

      $('load_btn').addEventListener('click', loadMessages);
      $('back_btn').addEventListener('click', () => navigate(-1));
      $('next_btn').addEventListener('click', () => navigate(1));
      $('classify_btn').addEventListener('click', () => analyzeCurrent(false));
      $('reanalyze_btn').addEventListener('click', () => analyzeCurrent(true));

      function setStatus(text, isError) {
        const el = $('status');
        el.textContent = text || '';
        el.className = isError ? 'error' : '';
      }

      function clampLimit(value) {
        const parsed = Number.parseInt(value, 10);
        if (!Number.isFinite(parsed)) return 200;
        return Math.max(1, Math.min(200, parsed));
      }

      function currentMessage() {
        return state.messages[state.currentIndex] || null;
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text || '';
        return div.innerHTML;
      }

      async function loadMessages() {
        const limit = clampLimit($('limit_input').value);
        $('limit_input').value = String(limit);
        const query = $('query_input').value || 'in:inbox';

        setStatus('Loading inbox from backend...');
        $('viewer').style.display = 'none';
        state.analysisById.clear();

        try {
          const url = `/api/messages?limit=${limit}&query=${encodeURIComponent(query)}`;
          const resp = await fetch(url);
          const payload = await resp.json();
          if (!resp.ok) {
            throw new Error(payload.detail || 'Failed to load messages');
          }

          state.messages = payload.messages || [];
          state.currentIndex = 0;

          if (state.messages.length === 0) {
            setStatus('No messages returned for that query.');
            return;
          }

          $('viewer').style.display = 'block';
          renderCurrent();
          setStatus(`Loaded ${state.messages.length} messages.`);
        } catch (err) {
          setStatus(err.message || String(err), true);
        }
      }

      function renderCurrent() {
        const msg = currentMessage();
        if (!msg) {
          $('viewer').style.display = 'none';
          return;
        }

        $('meta').innerHTML =
          `<strong>${escapeHtml(msg.subject || '(no subject)')}</strong>` +
          `<div><b>From:</b> ${escapeHtml(msg.sender || '')}</div>` +
          `<div><b>Date:</b> ${escapeHtml(msg.date || '')}</div>`;
        $('email_body').textContent = msg.body || '(No plain text body extracted. Attachments are ignored.)';
        $('position').textContent = `${state.currentIndex + 1} / ${state.messages.length}`;
        $('back_btn').disabled = state.currentIndex <= 0;
        $('next_btn').disabled = state.currentIndex >= state.messages.length - 1;
        refreshLlmPanelFromCache();
      }

      function refreshLlmPanelFromCache() {
        const msg = currentMessage();
        if (!msg) return;
        const cached = state.analysisById.get(msg.id);
        if (cached) {
          $('llm_state').textContent = 'Using cached result';
          renderLlmResult(cached);
        } else {
          $('llm_state').textContent = 'Not analyzed yet — press “Classify with LLM”.';
          $('llm_json').textContent = '';
        }
      }

      function renderLlmResult(result) {
        $('llm_json').textContent = JSON.stringify(result, null, 2);
      }

      async function analyzeCurrent(forceRefresh) {
        const msg = currentMessage();
        if (!msg) return;

        const cacheKey = msg.id;
        if (!forceRefresh && state.analysisById.has(cacheKey)) {
          refreshLlmPanelFromCache();
          return;
        }

        $('llm_state').textContent = 'Analyzing with LLM...';
        $('llm_json').textContent = '';
        try {
          const resp = await fetch('/api/classify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              subject: msg.subject || '',
              sender: msg.sender || '',
              snippet: msg.snippet || '',
              body: msg.body || '',
            }),
          });
          const payload = await resp.json();
          if (!resp.ok) {
            throw new Error(payload.detail || 'LLM classification failed');
          }

          state.analysisById.set(cacheKey, payload);
          $('llm_state').textContent = 'LLM result';
          renderLlmResult(payload);
        } catch (err) {
          $('llm_state').textContent = 'LLM error';
          renderLlmResult({ error: err.message || String(err) });
        }
      }

      function navigate(delta) {
        const next = state.currentIndex + delta;
        if (next < 0 || next >= state.messages.length) return;
        state.currentIndex = next;
        renderCurrent();
      }
    </script>
  </body>
</html>
